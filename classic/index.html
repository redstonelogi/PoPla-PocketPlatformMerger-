<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Pocket Platformer Merger</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .merger-box {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #4CAF50;
            text-align: center;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .help-text {
            margin: 8px 0 0;
            color: #bbb;
            font-size: 12px;
        }
        input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #45a049;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #ffeb3b;
        }
    </style>
</head>
<body>

<div class="merger-box">
    <h2>PoPla Merger</h2>

    <div class="input-group">
        <label for="games">PocketPlatformer-Games (minimum 2, beware of order of games):</label>
        <input type="file" id="games" accept=".html" multiple>
        <p class="help-text">Benutzerdefinierte Sprites aus den einzelnen Spielen bleiben erhalten.</p>
    </div>

    <button id="mergeButton">Merge</button>
    <div id="status"></div>
</div>

<!-- Hier binden wir deine JavaScript-Logik ein -->
<script src="main.js"></script>
</body>
</html>
